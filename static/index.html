<!doctype html>
<html lang="ru" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>File Vault</title>
  <link
    rel="icon"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='4' fill='%236366f1'/%3E%3Cpath d='M8 3a2.5 2.5 0 0 0-2.5 2.5V7H5a1 1 0 0 0-1 1v4a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1V8a1 1 0 0 0-1-1h-.5V5.5A2.5 2.5 0 0 0 8 3zm1.5 4h-3V5.5a1.5 1.5 0 0 1 3 0V7z' fill='white'/%3E%3C/svg%3E"
  >
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
    crossorigin="anonymous"
  >
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    rel="stylesheet"
    integrity="sha384-XGjxtQfXaH2tnPFa9x+ruJTuLE3Aa6LhHSWRr1XeTyhezb4abCG4ccI5AkVDxqC+"
    crossorigin="anonymous"
  >
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <main class="container d-flex flex-column justify-content-center flex-grow-1 py-5">
    <div class="row justify-content-center">
      <div class="col-12 col-md-8 col-lg-6 col-xl-5">

        <div class="mb-4 text-center">
          <h1 class="h3 fw-semibold mb-2">File Vault</h1>
          <p class="text-secondary mb-0" style="font-size: 0.95rem;">
            Безопасная передача текста и файлов.<br>
            Удаляется навсегда после первого открытия.
          </p>
        </div>

        <form id="create-form" novalidate>
          <div class="editor-container mb-4">

            <textarea
              class="form-control form-control-plain w-100"
              id="content"
              rows="5"
              placeholder="Введите секретный текст..."
              autofocus
            ></textarea>

            <div class="editor-toolbar">

              <!-- Контейнер для кнопки и чипа -->
              <div>
                <button type="button" class="btn btn-link btn-attach" id="attach-btn">
                  <i class="bi bi-paperclip fs-5"></i> Прикрепить
                </button>
                <input type="file" id="file" class="visually-hidden">

                <div id="file-chip" class="d-none">
                  <div class="file-pill">
                    <i class="bi bi-file-earmark-text text-secondary"></i>
                    <span id="file-name" class="text-truncate" style="max-width: 150px;"></span>
                    <button type="button" class="btn-close btn-close-white" id="file-clear" aria-label="Удалить"></button>
                  </div>
                </div>
              </div>

              <!-- Выбор времени -->
              <div class="d-flex align-items-center">
                <i class="bi bi-clock-history text-secondary ms-2" style="font-size: 0.85rem;"></i>
                <select class="form-select form-select-sm ttl-select" id="ttl">
                  <option value="300">5 минут</option>
                  <option value="3600" selected>1 час</option>
                  <option value="86400">1 день</option>
                  <option value="604800">7 дней</option>
                </select>
              </div>

            </div>
          </div>

          <button type="submit" class="btn btn-primary w-100 shadow-sm">
            Создать секретную ссылку
          </button>
        </form>

        <!-- Блок результата -->
        <div id="result" class="result-box mt-4 d-none">
          <label class="form-label text-secondary small fw-medium mb-2">Ссылка готова к отправке</label>
          <div class="input-group result-input-group mb-2">
            <input type="text" id="result-link" class="form-control" readonly>
            <button class="btn btn-copy" id="copy-btn" type="button" title="Скопировать ссылку">
              <i class="bi bi-copy"></i>
            </button>
          </div>
          <div class="text-secondary small">
            <i class="bi bi-info-circle me-1"></i> Ссылка сгорит сразу после перехода по ней.
          </div>
        </div>

        <div id="error" class="alert alert-danger-soft mt-4 d-none border-0" role="alert"></div>

      </div>
    </div>
  </main>

  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
    crossorigin="anonymous"
  ></script>
  <script src="js/app.js"></script>
</body>
</html>
