<!doctype html>
<html lang="ru" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>File Vault — просмотр секрета</title>
  <link
    rel="icon"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='4' fill='%236366f1'/%3E%3Cpath d='M8 3a2.5 2.5 0 0 0-2.5 2.5V7H5a1 1 0 0 0-1 1v4a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1V8a1 1 0 0 0-1-1h-.5V5.5A2.5 2.5 0 0 0 8 3zm1.5 4h-3V5.5a1.5 1.5 0 0 1 3 0V7z' fill='white'/%3E%3C/svg%3E"
  >
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
    crossorigin="anonymous"
  >
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    rel="stylesheet"
    integrity="sha384-XGjxtQfXaH2tnPFa9x+ruJTuLE3Aa6LhHSWRr1XeTyhezb4abCG4ccI5AkVDxqC+"
    crossorigin="anonymous"
  >
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <main class="container d-flex flex-column justify-content-center flex-grow-1 py-5">
    <div class="row justify-content-center">
      <div class="col-12 col-md-8 col-lg-6 col-xl-5">

        <div class="mb-4 text-center">
          <a href="/" class="text-decoration-none text-reset">
            <h1 class="h3 fw-semibold mb-0">File Vault</h1>
          </a>
        </div>

        <div id="state-reveal" class="result-box text-center">
          <i class="bi bi-shield-lock fs-1 text-secondary d-block mb-3"></i>
          <p class="text-secondary mb-3">
            Секрет будет показан только один раз. После этого ссылка перестанет работать.
          </p>
          <button type="button" class="btn btn-primary w-100 shadow-sm" id="reveal-btn" autofocus>
            Показать
          </button>
        </div>

        <div id="state-loading" class="result-box text-center text-secondary d-none">
          Открываем секрет...
        </div>

        <div id="state-text" class="result-box d-none">
          <label class="form-label text-secondary small fw-medium mb-2">Содержимое секрета</label>
          <div class="editor-container mb-3">
            <textarea
              id="secret-text"
              class="form-control form-control-plain w-100"
              rows="6"
              readonly
            ></textarea>
          </div>
          <button type="button" class="btn btn-outline-secondary w-100" id="copy-text-btn">
            <i class="bi bi-copy"></i> Скопировать
          </button>
        </div>

        <div id="state-file" class="result-box text-center d-none">
          <i class="bi bi-file-earmark-text fs-1 text-secondary d-block mb-3"></i>
          <div id="file-info" class="mb-3 text-break"></div>
          <a href="#" id="download-btn" class="btn btn-primary w-100 shadow-sm">
            <i class="bi bi-download"></i> Скачать файл
          </a>
        </div>

        <div id="state-error" class="result-box text-center d-none">
          <i class="bi bi-exclamation-triangle fs-1 text-secondary d-block mb-3"></i>
          <p class="text-secondary mb-3" id="error-message"></p>
          <a href="/" class="btn btn-primary w-100 shadow-sm">Создать новый секрет</a>
        </div>

      </div>
    </div>
  </main>

  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
    crossorigin="anonymous"
  ></script>
  <script src="js/view.js"></script>
</body>
</html>
